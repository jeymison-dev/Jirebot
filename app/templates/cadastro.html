<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/style.css">
    <title>Cadastro</title>
    <!-- Substitua pelo caminho real do seu CSS se tiver, ex: ../static/css/style.css -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="form-container">
        <h2>Criar Conta</h2>
        <form action="/cadastro" method="POST">
            <div class="input-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" name="name" placeholder="Digite seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

			<div class="input-group">
				<label for="whatsapp">Whatsapp</label>
			    <input type="tel" id="whatsapp" name="whatsapp" placeholder="(11) 99999-9999" required>
			</div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Crie uma senha" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirmar Senha</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita a senha" required>
            </div>

            <button type="submit" class="btn-submit">Cadastrar</button>
        </form>

        <p class="switch-form">Já tem uma conta? <a href="index.html">Faça login aqui</a></p>
    </div>
</body>
</html>
